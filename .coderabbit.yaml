# .coderabbit.yaml
# Configuración de CodeRabbit para POS BALAM (Balam).
# Objetivo: revisor independiente de Pull Requests hacia main.
# Autoridad de revisión: docs/architect (Sistema Operativo de Ingeniería).
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: es-ES

early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!package-lock.json"
    - "!**/*.generated.*"
    - "!**/POS Balam (offline).html"
  path_instructions:
    - path: "supabase/**"
      instructions: >-
        Revisar con máximo rigor la integridad de datos, las migraciones y la
        seguridad. Verificar RLS, roles, permisos, vistas y funciones SQL contra
        docs/architect/authorities/security.md y docs/architect/playbooks/security.md.
        Las migraciones deben cumplir ADR-004 (verificación autocontenida) y
        ADR-005 (autorización en RLS y perfil activo). Señalar cualquier riesgo
        de pérdida o corrupción de datos como defecto bloqueante.
    - path: "**/*.sql"
      instructions: >-
        Auditar permisos, roles y RLS. Ninguna sentencia debe ampliar el acceso
        sin justificación explícita. Priorizar seguridad e integridad de datos
        sobre estilo.
    - path: "balam/**"
      instructions: >-
        Revisar la cola offline, la sincronización y los artefactos de build
        según ADR-006 (local-first), ADR-007 (cero red en runtime) y ADR-008
        (el artefacto generado no es fuente). Vigilar regresiones en la
        sincronización y en la durabilidad de la cola.
    - path: "**/test-*.mjs"
      instructions: >-
        Tratar los archivos test-*.mjs como red de regresión. Una prueba
        modificada o debilitada es un hallazgo relevante. No declarar aprobada
        ninguna prueba no ejecutada (R-DEL-02).
    - path: "docs/architect/**"
      instructions: >-
        Estos documentos son la autoridad de ingeniería. Verificar que los IDs
        (AP-XX, ADR-XXX, R-XXX-NN) no se renumeren ni reutilicen y que no se
        dupliquen autoridades de negocio.
  labeling_instructions: []
  tools:
    github-checks:
      enabled: true
  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local

# .github/workflows/ci.yml
# CI obligatorio para POS BALAM (H-62).
# Ejecuta las pruebas reales del repositorio en cada Pull Request hacia main.
# No despliega ni modifica producción: solo lee el código y corre pruebas.

name: CI

on:
  pull_request:
    branches:
      - main

# Sin permisos de escritura: este workflow no puede desplegar ni tocar producción.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que Google Chrome esté disponible (pruebas E2E con playwright-core)
        run: |
          google-chrome --version || (echo "Google Chrome no está disponible en el runner" && exit 1)

      - name: Ejecutar todas las pruebas test-*.mjs
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=( test-*.mjs )
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No se encontraron archivos test-*.mjs" >&2
            exit 1
          fi
          echo "Se ejecutarán ${#tests[@]} archivos de prueba."
          passed=0
          failed=0
          failed_list=()
          for t in "${tests[@]}"; do
            echo "──────────────────────────────────────────────"
            echo "▶ node $t"
            if node "$t"; then
              passed=$((passed+1))
            else
              code=$?
              echo "❌ FALLÓ: $t (exit $code)"
              failed=$((failed+1))
              failed_list+=( "$t" )
            fi
          done
          echo "══════════════════════════════════════════════"
          echo "Resumen: $passed archivos pasaron, $failed fallaron."
          if [ $failed -ne 0 ]; then
            echo "Archivos con fallos:"
            for f in "${failed_list[@]}"; do echo "  - $f"; done
            exit 1
          fi

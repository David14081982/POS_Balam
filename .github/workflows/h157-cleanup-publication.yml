name: H-157 approved cleanup publication

# Owner-authorized exception for the exact H157 artifact already tested 4/4.
# This does not certify Supabase convergence or change the general H148 gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: balam-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # An old re-run must not roll back a newer version of the application.
          ref: main
          fetch-depth: 0
      - name: Require the exact approved source and delivery files
        shell: bash
        run: |
          git merge-base --is-ancestor f985820e86d22d3234e87f219f8ffe1ff13d34d9 HEAD
          git diff --exit-code f985820e86d22d3234e87f219f8ffe1ff13d34d9 HEAD -- \
            balam build-offline.mjs package.json package-lock.json .gitattributes \
            supabase/migrations index.html 'POS Balam (offline).html' sw.js \
            manifest.webmanifest pwa test-h157-cleanup-readiness.mjs \
            docs/fixes/evidence/h157-correction.json
      - name: Verify approved bytes and the existing four results
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const expected = '80de96831e1f37a26bfeab36ddedca768ff2d1ee1281b0a4ee0449cf075dbe71';
          const sha = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(sha('index.html'), expected);
          assert.equal(sha('POS Balam (offline).html'), expected);
          assert.equal(sha('sw.js'), '464c11af2bffda8993500ea82c189810bb97b636356535aa88866ea2a1c51f0c');
          const evidence = JSON.parse(fs.readFileSync('docs/fixes/evidence/h157-correction.json', 'utf8'));
          assert.equal(evidence.artifactSHA256, expected);
          assert.equal(evidence.results.length, 4);
          assert.ok(evidence.results.every(result => result.passed === true));
          assert.equal(evidence.remoteBusinessWrites, 0);
          assert.equal(evidence.distributedCertification, 'NO CERTIFICADO');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `H157: owner-authorized publication of ${expected}. Four existing local scenarios passed. ` +
            'No additional scenarios executed. Supabase A/B/C: NO CERTIFICADO.\n');
          NODE
      - name: Stage the approved Pages files
        shell: bash
        run: |
          mkdir _site
          cp index.html 'POS Balam (offline).html' sw.js manifest.webmanifest _site/
          cp -R pwa _site/pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

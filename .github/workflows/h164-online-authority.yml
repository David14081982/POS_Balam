name: H164 online authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: Run real Supabase A/B/C QA matrix; retain exact QA history (does not deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for the final artifact
        shell: pwsh
        run: |
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $balamBrowserPath = node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath());"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BALAM_CHROME_EXECUTABLE=$balamBrowserPath" >> $env:GITHUB_ENV
      - run: npm run test:online:architecture
      - run: npm run test:migrations
      - run: npm run test:online:sql
      - run: npm run test:online:transport
      - run: npm run test:online:adoption
      - run: npm run test:online:startup
      - run: npm run test:online:data
      - run: npm run test:online:config
      - run: npm run test:online:account
      - run: npm run test:online:messages
      - run: npm run test:online:identity
      - run: npm run test:online:settings
      - run: npm run test:online:callbacks
      - run: npm run build
      - name: Require generated bytes to match the commit
        shell: pwsh
        run: |
          git diff --quiet -- index.html 'POS Balam (offline).html' sw.js manifest.webmanifest pwa
          if ($LASTEXITCODE -ne 0) { throw 'Generated client differs from the committed artifact. Regenerate and commit the tested files.' }
      - run: npm run test:online:ui
        env:
          BALAM_VERIFIED_HTML: index.html
      - run: npm run test:online:pwa
        env:
          BALAM_VERIFIED_HTML: index.html
      - run: npm run test:online:pwa-adoption
        env:
          BALAM_VERIFIED_HTML: index.html
      - name: Stage the tested client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path _site
          Copy-Item -LiteralPath index.html, 'POS Balam (offline).html', sw.js, manifest.webmanifest -Destination _site
          Copy-Item -LiteralPath pwa -Destination _site -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: h164-tested-client
          path: _site
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h164-local-evidence
          path: .evidence-h164
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.live
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.live
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: balam-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  live-certification:
    # Provisioning secrets never run in PRs, other refs, or automatic deployments.
    if: github.event_name == 'workflow_dispatch' && inputs.live && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: balam-live-supabase-certification
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BALAM_ONLINE_LIVE: '1'
      BALAM_TEST_OUTPUT: online-evidence
      BALAM_VERIFIED_HTML: verified-client/index.html
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: h164-tested-client
          path: verified-client
      - name: Install Chromium for independent A/B/C contexts
        shell: pwsh
        run: |
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $balamBrowserPath = node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath());"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BALAM_CHROME_EXECUTABLE=$balamBrowserPath" >> $env:GITHUB_ENV
      - run: npm run test:online:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h164-real-authority
          path: online-evidence
          if-no-files-found: error
